secrets:
  sqlpass :
    file: ../secrets/MYSQL_PASSWORD.txt
  wpadminpass : 
    file: ../secrets/wp_admin_password.txt
  wpuserpass :
    file: ../secrets/wp_user_pass.txt


services:
  nginx:
    build: ./NGINX
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - wordpress
    networks:
      - network
    env_file: .env
    restart: unless-stopped

  wordpress:
    build: ./wordpress
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - mariadb
    networks:
      - network
    env_file: .env
    restart: unless-stopped
    secrets:
      - wpadminpass
      - wpuserpass
      - sqlpass
  mariadb:
    build: ./mariadb
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - network
    env_file: .env
    restart: unless-stopped
    secrets:
      - sqlpass

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/lloginov/data/wordpress

  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/lloginov/data/mariadb

networks:
  network:
    name: inception
    driver: bridge